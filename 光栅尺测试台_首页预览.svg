  <text x="1082" y="581">· 设备及基准未连接</text>
  <text x="1082" y="604">· 安全链状态未知</text>
  <rect x="1070" y="634" width="142" height="44" rx="2" fill="#E0E0E0" stroke="#B8B8B8" />
  <rect x="1224" y="634" width="142" height="44" rx="2" fill="#E0E0E0" stroke="#B8B8B8" />
