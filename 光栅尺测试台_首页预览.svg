  <g fill="#B5B5B5"><circle cx="1435" cy="477" r="6" /><circle cx="1435" cy="511" r="6" /><circle cx="1435" cy="545" r="6" /><circle cx="1435" cy="579" r="6" /></g>
  <text x="1452" y="482">运动控制器：未连接</text>
