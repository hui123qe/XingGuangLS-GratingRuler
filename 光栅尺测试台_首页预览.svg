  <text x="1295" y="662" text-anchor="middle" class="disabled">停止测试</text>
  <!-- 下部结果 -->
  <rect x="228" y="706" width="1154" height="218" class="panel" />
  <text x="244" y="735" class="heading">点位记录与结果</text>
  <text x="896" y="735" class="secondary">数据质量：尚未采样　｜　判定：未判定</text>
  <rect x="244" y="751" width="1122" height="34" fill="#E9E9E9" stroke="#A6A6A6" />
  <rect x="244" y="785" width="1122" height="89" fill="white" stroke="#A6A6A6" />
  <text x="260" y="774">循环</text><text x="333" y="774">方向</text><text x="408" y="774">点号</text>
  <text x="488" y="774">目标位置 mm</text><text x="650" y="774">DUT mm</text><text x="806" y="774">基准 mm</text>
  <text x="958" y="774">误差 μm</text><text x="1090" y="774">有效样本</text><text x="1245" y="774">质量</text>
  <text x="805" y="837" text-anchor="middle" class="secondary">暂无点位记录；测试结束后保留原始数据、统计与异常</text>
