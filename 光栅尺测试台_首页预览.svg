<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980" role="img" aria-labelledby="title desc">
  <title id="title">光栅尺测试台 — 测试工作台界面方案</title>
  <desc id="desc">静态设计预览。左侧五项导航，中央配方摘要、测量曲线、执行控制和结果表，右侧设备状态。未连接、无采样数据，启动禁用。</desc>
  <defs>
    <style>
      text { font-family: 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif; fill: #202020; font-size: 14px; }
      .secondary { fill: #606060; }
      .title { font-size: 22px; font-weight: 600; }
      .heading { font-size: 16px; font-weight: 600; }
      .panel { fill: #FAF9F9; stroke: #A6A6A6; }
      .line { stroke: #B8B8B8; }
      .button { fill: #F0F0F0; stroke: #B8CAE5; }
      .disabled { fill: #9A9A9A; }
      .value { font-size: 22px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1680" height="980" fill="#ECE9E9" />
  <!-- 顶部标题与软件急停 -->
  <rect width="1680" height="78" fill="#F4F4F4" />
  <path d="M0 78H1680" class="line" />
  <text x="24" y="35" class="title">光栅尺测试台</text>
  <text x="24" y="59" class="secondary">测量 · 采集 · 分析</text>
  <text x="1190" y="44" class="secondary">界面方案预览 · 非实时设备状态</text>
  <rect x="1484" y="17" width="172" height="44" rx="2" fill="#FF0000" stroke="#B00000" />
  <text x="1570" y="45" text-anchor="middle" style="fill:white;font-weight:600;font-size:16px">软件急停</text>
  <!-- 左侧功能导航 -->
  <path d="M210 78V942" class="line" />
  <text x="20" y="114" class="heading">功能导航</text>
  <g fill="#A9C2E9" stroke="#829FC8">
    <rect x="14" y="136" width="182" height="60" />
    <rect x="14" y="202" width="182" height="60" />
    <rect x="14" y="268" width="182" height="60" />
    <rect x="14" y="334" width="182" height="60" />
    <rect x="14" y="400" width="182" height="60" />
  </g>
  <rect x="18" y="140" width="174" height="52" fill="none" stroke="white" />
