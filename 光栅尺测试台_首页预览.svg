  <rect x="292" y="444" width="716" height="194" fill="white" stroke="#A6A6A6" />
  <path d="M292 492H1008M292 540H1008M292 588H1008M435 444V638M578 444V638M721 444V638M864 444V638" stroke="#E7E7E7" fill="none" />
