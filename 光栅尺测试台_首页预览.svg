    <text x="105" y="238">参数设置</text>
    <text x="105" y="304">维护界面</text>
    <text x="105" y="370">运行记录</text>
    <text x="105" y="436">报警记录</text>
  </g>
  <text x="20" y="880" class="secondary">当前任务</text>
  <text x="20" y="907">T01-S 静态往返</text>
